---
- name: Reload systemd for Hermes CABAL
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Hermes CABAL gateway
  ansible.builtin.systemd_service:
    name: "{{ hermes_cabal_agent_service_name }}"
    state: restarted
  when:
    - hermes_cabal_agent_service_enabled | bool
    - hermes_cabal_agent_activation_accepted | bool
    - hermes_cabal_agent_secrets_install | bool
