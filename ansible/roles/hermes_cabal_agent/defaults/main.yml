---
hermes_cabal_agent_application_root: "/opt/CABAL"
hermes_cabal_agent_user: "saadali"
hermes_cabal_agent_group: "saadali"
hermes_cabal_agent_user_home: "/home/saadali"
hermes_cabal_agent_root: "{{ hermes_cabal_agent_application_root }}/hermes"
hermes_cabal_agent_home: "{{ hermes_cabal_agent_root }}/home"

hermes_cabal_agent_repo: "https://github.com/NousResearch/hermes-agent.git"
hermes_cabal_agent_commit: "f97608f178d1ffeca59860195ab7da295f7c8e5f"
hermes_cabal_agent_package_version: "0.21.5"
hermes_cabal_agent_release: "v2026.9.24"
hermes_cabal_agent_source_dir: "{{ hermes_cabal_agent_root }}/src/{{ hermes_cabal_agent_commit }}"
hermes_cabal_agent_venv: >-
  {{ hermes_cabal_agent_root }}/venvs/{{ hermes_cabal_agent_package_version }}-{{ hermes_cabal_agent_commit }}
hermes_cabal_agent_python: "/usr/bin/python3.13"
hermes_cabal_agent_uv: "/home/saadali/.local/bin/uv"
hermes_cabal_agent_uv_version: "0.9.30"

# Reusable-role defaults never install artifacts, credentials, or start services.
hermes_cabal_agent_runtime_install: false
hermes_cabal_agent_home_manage: false
hermes_cabal_agent_secrets_install: false
hermes_cabal_agent_service_enabled: false
hermes_cabal_agent_activation_accepted: false

hermes_cabal_agent_service_name: "hermes-cabal.service"
hermes_cabal_agent_config_dir: "{{ hermes_cabal_agent_application_root }}/config"
hermes_cabal_agent_env_file: "{{ hermes_cabal_agent_config_dir }}/hermes.env"
hermes_cabal_agent_timeout_stop_seconds: 70

# Variables with these names may come from encrypted inventory. Nonempty
# inventory values take precedence over controller environment fallbacks.
hermes_cabal_agent_bifrost_key_env: "BIFROST_HERMES_VIRTUAL_KEY"
hermes_cabal_agent_hindsight_key_env: "HINDSIGHT_API_KEY"

# Sanitized prepared-profile subset supplied by private non-secret group vars.
# It intentionally excludes plugins, memory provider data, MCP definitions,
# runtime state, and every credential value.
hermes_cabal_agent_profile_base: {}
hermes_cabal_agent_private_assets: []
hermes_cabal_agent_required_disabled_toolsets:
  - terminal
  - file
  - browser
  - computer_use
  - code_execution
  - session_search
  - cronjob
  - connections

# Direct Hindsight MCP only; native plugin/provider and automatic capture remain off.
hermes_cabal_agent_hindsight_mcp_url: "https://hindsight-api.h.nixknight.pk/mcp/cabal-private/"
hermes_cabal_agent_hindsight_mcp_enabled: true
hermes_cabal_agent_hindsight_tools:
  - retain
  - recall
  - reflect
hermes_cabal_agent_hindsight_timeout: 120
hermes_cabal_agent_hindsight_connect_timeout: 30

# Hermes owns this stdio child. There is intentionally no whatsapp-mcp service.
hermes_cabal_agent_whatsapp_mcp_enabled: false
hermes_cabal_agent_whatsapp_tools:
  - get_messages
  - get_contact
hermes_cabal_agent_whatsapp_timeout: 60
hermes_cabal_agent_whatsapp_connect_timeout: 15
hermes_cabal_agent_whatsapp_bridge_url: "http://127.0.0.1:8080"
hermes_cabal_agent_whatsapp_uv: "{{ hermes_cabal_whatsapp_uv | default('/home/saadali/.local/bin/uv') }}"
hermes_cabal_agent_whatsapp_python: "{{ hermes_cabal_whatsapp_python | default('/usr/bin/python3.13') }}"
hermes_cabal_agent_whatsapp_project: >-
  {{ hermes_cabal_whatsapp_mcp_project | default('/opt/CABAL/whatsapp/src/0fab6208fd6e457efcd348d97f3e84e4832357e2/mcp-server') }}
hermes_cabal_agent_whatsapp_venv: >-
  {{ hermes_cabal_whatsapp_mcp_venv | default('/opt/CABAL/whatsapp/venvs/mcp-0fab6208fd6e457efcd348d97f3e84e4832357e2') }}
