---
- name: Clone the exact Hermes source revision into its versioned path
  ansible.builtin.git:
    repo: "{{ hermes_cabal_agent_repo }}"
    dest: "{{ hermes_cabal_agent_source_dir }}"
    version: "{{ hermes_cabal_agent_commit }}"
    update: true
    force: true
    recursive: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Read the checked-out Hermes revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_cabal_agent_source_dir }}"
      - rev-parse
      - HEAD
  register: hermes_cabal_agent_source_revision
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Check the exact Hermes source for drift
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_cabal_agent_source_dir }}"
      - status
      - --porcelain=v1
      - --untracked-files=all
  register: hermes_cabal_agent_source_status
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Require the exact clean Hermes source revision
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_source_revision.stdout | trim == hermes_cabal_agent_commit
      - hermes_cabal_agent_source_status.stdout | trim == ""
    fail_msg: The Ansible-owned Hermes source is not the exact clean approved revision.
  when: hermes_cabal_agent_runtime_install | bool

- name: Read the selected Hermes uv version
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_agent_uv }}"
      - --version
  register: hermes_cabal_agent_uv_version_result
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Read the selected Hermes Python version
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_agent_python }}"
      - --version
  register: hermes_cabal_agent_python_version_result
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Require uv 0.9.30 and Python 3.13 for Hermes
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_uv_version_result.stdout | trim == "uv " ~ hermes_cabal_agent_uv_version
      - >-
        (hermes_cabal_agent_python_version_result.stdout
        ~ hermes_cabal_agent_python_version_result.stderr) is search('Python 3\\.13\\.')
    fail_msg: Hermes preparation requires the selected uv 0.9.30 binary and Python 3.13 interpreter.
  when: hermes_cabal_agent_runtime_install | bool

- name: Synchronize the exact Hermes runtime with MCP support
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_agent_uv }}"
      - sync
      - --locked
      - --no-default-groups
      - --extra
      - mcp
      - --python
      - "{{ hermes_cabal_agent_python }}"
      - --project
      - "{{ hermes_cabal_agent_source_dir }}"
    creates: "{{ hermes_cabal_agent_venv }}/bin/hermes"
  become: true
  become_user: "{{ hermes_cabal_agent_user }}"
  environment:
    HOME: "{{ hermes_cabal_agent_user_home }}"
    UV_PROJECT_ENVIRONMENT: "{{ hermes_cabal_agent_venv }}"
  notify: Restart Hermes CABAL gateway
  when: hermes_cabal_agent_runtime_install | bool

- name: Read the installed Hermes package version
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_agent_venv }}/bin/python"
      - -c
      - >-
        import importlib.metadata;
        print(importlib.metadata.version('hermes-agent'))
  register: hermes_cabal_agent_installed_version
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Require Hermes package 0.21.5
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_installed_version.stdout | trim == hermes_cabal_agent_package_version
    fail_msg: The locked environment did not produce Hermes package 0.21.5.
  when: hermes_cabal_agent_runtime_install | bool

- name: Recheck Hermes source cleanliness after locked sync
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ hermes_cabal_agent_source_dir }}"
      - status
      - --porcelain=v1
      - --untracked-files=all
  register: hermes_cabal_agent_final_source_status
  changed_when: false
  when: hermes_cabal_agent_runtime_install | bool

- name: Require locked sync to leave the Hermes source clean
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_final_source_status.stdout | trim == ""
    fail_msg: Locked Hermes synchronization introduced source-tree drift.
  when: hermes_cabal_agent_runtime_install | bool
