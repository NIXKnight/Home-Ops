---
- name: Check required Hermes activation artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_cabal_agent_venv }}/bin/python"
    - "{{ hermes_cabal_agent_home }}/config.yaml"
    - "{{ hermes_cabal_agent_env_file }}"
  register: hermes_cabal_agent_activation_artifacts
  when: hermes_cabal_agent_service_enabled | bool

- name: Require staged Hermes artifacts before activation
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_activation_artifacts.results | map(attribute='stat.exists') | min
    fail_msg: The Hermes runtime, managed config, or root-owned service environment is missing.
  when: hermes_cabal_agent_service_enabled | bool

- name: Install the Ansible-owned Hermes gateway system unit
  ansible.builtin.template:
    src: hermes-cabal.service.j2
    dest: "/etc/systemd/system/{{ hermes_cabal_agent_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Hermes CABAL
    - Restart Hermes CABAL gateway

- name: Apply Hermes unit changes before state convergence
  ansible.builtin.meta: flush_handlers

- name: Converge the gated Hermes gateway service state
  ansible.builtin.systemd_service:
    name: "{{ hermes_cabal_agent_service_name }}"
    enabled: "{{ hermes_cabal_agent_service_enabled | bool }}"
    state: "{{ (hermes_cabal_agent_service_enabled | bool) | ternary('started', 'stopped') }}"
    daemon_reload: true
