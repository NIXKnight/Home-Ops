---
- name: Create the isolated Hermes home layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_cabal_agent_user }}"
    group: "{{ hermes_cabal_agent_group }}"
    mode: "0700"
  loop:
    - "{{ hermes_cabal_agent_home }}"
    - "{{ hermes_cabal_agent_home }}/memories"
    - "{{ hermes_cabal_agent_home }}/skills"
    - "{{ hermes_cabal_agent_home }}/skills/pi-roles"
  when: hermes_cabal_agent_home_manage | bool

- name: Create explicit private asset destination directories
  ansible.builtin.file:
    path: "{{ hermes_cabal_agent_home }}/{{ item.dest | dirname }}"
    state: directory
    owner: "{{ hermes_cabal_agent_user }}"
    group: "{{ hermes_cabal_agent_group }}"
    mode: "0700"
  loop: "{{ hermes_cabal_agent_private_assets }}"
  loop_control:
    label: "{{ item.dest }}"
  when: hermes_cabal_agent_home_manage | bool

- name: Copy only the approved portable private assets
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ hermes_cabal_agent_home }}/{{ item.dest }}"
    owner: "{{ hermes_cabal_agent_user }}"
    group: "{{ hermes_cabal_agent_group }}"
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ hermes_cabal_agent_private_assets }}"
  loop_control:
    label: "{{ item.dest }}"
  diff: false
  notify: Restart Hermes CABAL gateway
  when: hermes_cabal_agent_home_manage | bool

- name: Ensure native Hindsight plugin artifacts are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ hermes_cabal_agent_home }}/plugins/hindsight"
    - "{{ hermes_cabal_agent_home }}/plugins/.install-metadata.json"
    - "{{ hermes_cabal_agent_home }}/plugins/.install-metadata.json.lock"
    - "{{ hermes_cabal_agent_home }}/hindsight"
  notify: Restart Hermes CABAL gateway
  when: hermes_cabal_agent_home_manage | bool

- name: Check semantic WhatsApp readiness before enabling its MCP entry
  ansible.builtin.uri:
    url: "{{ hermes_cabal_agent_whatsapp_bridge_url }}/api/status"
    method: GET
    return_content: true
    status_code: 200
    timeout: 10
  register: hermes_cabal_agent_whatsapp_readiness
  no_log: true
  when:
    - hermes_cabal_agent_home_manage | bool
    - hermes_cabal_agent_whatsapp_mcp_enabled | bool

- name: Require CONNECTED WhatsApp readiness before MCP exposure
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_whatsapp_readiness.json.state == "CONNECTED"
      - hermes_cabal_agent_whatsapp_readiness.json.is_connected is sameas true
    fail_msg: >-
      WhatsApp MCP exposure requires /api/status state CONNECTED and
      is_connected true; HTTP success alone is insufficient.
  when:
    - hermes_cabal_agent_home_manage | bool
    - hermes_cabal_agent_whatsapp_mcp_enabled | bool

- name: Check the exact WhatsApp MCP runtime paths before exposure
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_cabal_agent_whatsapp_project }}/pyproject.toml"
    - "{{ hermes_cabal_agent_whatsapp_venv }}/bin/whatsapp-mcp"
  register: hermes_cabal_agent_whatsapp_runtime_paths
  when:
    - hermes_cabal_agent_home_manage | bool
    - hermes_cabal_agent_whatsapp_mcp_enabled | bool

- name: Require the exact WhatsApp MCP project and venv before exposure
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_whatsapp_runtime_paths.results | map(attribute='stat.exists') | min
    fail_msg: The exact WhatsApp MCP project or locked venv is missing.
  when:
    - hermes_cabal_agent_home_manage | bool
    - hermes_cabal_agent_whatsapp_mcp_enabled | bool

- name: Render the MCP-only Hermes configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_cabal_agent_home }}/config.yaml"
    owner: "{{ hermes_cabal_agent_user }}"
    group: "{{ hermes_cabal_agent_group }}"
    mode: "0600"
  diff: false
  notify: Restart Hermes CABAL gateway
  when: hermes_cabal_agent_home_manage | bool

- name: Resolve Hermes credentials from Vault or controller environment
  ansible.builtin.set_fact:
    hermes_cabal_agent_bifrost_key: >-
      {{
        vars.get(hermes_cabal_agent_bifrost_key_env, '')
        | default(
            lookup('ansible.builtin.env', hermes_cabal_agent_bifrost_key_env),
            true
          )
      }}
    hermes_cabal_agent_hindsight_key: >-
      {{
        vars.get(hermes_cabal_agent_hindsight_key_env, '')
        | default(
            lookup('ansible.builtin.env', hermes_cabal_agent_hindsight_key_env),
            true
          )
      }}
  no_log: true
  when: hermes_cabal_agent_secrets_install | bool

- name: Require named Hermes credentials
  ansible.builtin.assert:
    that:
      - hermes_cabal_agent_bifrost_key | default('') | length > 0
      - hermes_cabal_agent_hindsight_key | default('') | length > 0
      - "'\n' not in hermes_cabal_agent_bifrost_key"
      - "'\r' not in hermes_cabal_agent_bifrost_key"
      - "'\n' not in hermes_cabal_agent_hindsight_key"
      - "'\r' not in hermes_cabal_agent_hindsight_key"
    fail_msg: >-
      Missing or invalid encrypted-inventory/controller-environment variables:
      {{ hermes_cabal_agent_bifrost_key_env }}, {{ hermes_cabal_agent_hindsight_key_env }}
  no_log: true
  when: hermes_cabal_agent_secrets_install | bool

- name: Install the root-owned Hermes service environment
  ansible.builtin.copy:
    content: |
      {{ hermes_cabal_agent_bifrost_key_env }}={{ hermes_cabal_agent_bifrost_key | to_json }}
      {{ hermes_cabal_agent_hindsight_key_env }}={{ hermes_cabal_agent_hindsight_key | to_json }}
    dest: "{{ hermes_cabal_agent_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart Hermes CABAL gateway
  when: hermes_cabal_agent_secrets_install | bool
