---
- name: Require the selected Linux AMD64 target
  ansible.builtin.assert:
    that:
      - ansible_system == "Linux"
      - ansible_architecture in ["x86_64", "amd64"]
      - hermes_cabal_whatsapp_commit | length == 40
      - hermes_cabal_whatsapp_application_root == "/opt/CABAL"
      - hermes_cabal_whatsapp_root == "/opt/CABAL/whatsapp"
      - >-
        hermes_cabal_whatsapp_source_dir ==
        "/opt/CABAL/whatsapp/src/" ~ hermes_cabal_whatsapp_commit
      - hermes_cabal_whatsapp_bin_dir == "/opt/CABAL/whatsapp/bin"
      - >-
        hermes_cabal_whatsapp_binary ==
        "/opt/CABAL/whatsapp/bin/whatsapp-bridge-" ~ hermes_cabal_whatsapp_commit
      - hermes_cabal_whatsapp_manifest == hermes_cabal_whatsapp_binary ~ ".sha256"
      - >-
        hermes_cabal_whatsapp_mcp_project ==
        "/opt/CABAL/whatsapp/src/" ~ hermes_cabal_whatsapp_commit ~ "/mcp-server"
      - >-
        hermes_cabal_whatsapp_mcp_venv ==
        "/opt/CABAL/whatsapp/venvs/mcp-" ~ hermes_cabal_whatsapp_commit
      - >-
        hermes_cabal_whatsapp_go_root ==
        "/opt/CABAL/toolchains/go/" ~ hermes_cabal_whatsapp_go_version
      - hermes_cabal_whatsapp_config_dir == "/opt/CABAL/config"
      - hermes_cabal_whatsapp_env_file == "/opt/CABAL/config/whatsapp-bridge.env"
      - hermes_cabal_whatsapp_data_dir == "/var/lib/hermes-cabal-whatsapp"
      - hermes_cabal_whatsapp_go_cache_dir == "/var/cache/hermes-cabal/go"
      - hermes_cabal_whatsapp_go_module_cache_dir == "/var/cache/hermes-cabal/mod"
      - hermes_cabal_whatsapp_bind == "127.0.0.1:8080"
      - hermes_cabal_whatsapp_bridge_url == "http://127.0.0.1:8080"
      - hermes_cabal_whatsapp_database_host == "postgresql.h.nixknight.pk"
      - hermes_cabal_whatsapp_database_address == "192.168.0.172"
      - hermes_cabal_whatsapp_database_port | int == 5432
      - hermes_cabal_whatsapp_database_name == "whatsapp_bridge"
      - hermes_cabal_whatsapp_database_user == "whatsapp_bridge"
      - hermes_cabal_whatsapp_database_sslmode == "verify-full"
      - hermes_cabal_whatsapp_database_ca_dir == "/opt/CABAL/config"
      - hermes_cabal_whatsapp_database_ca_path == "/opt/CABAL/config/postgresql-ca.crt"
      - hermes_cabal_whatsapp_database_ca_mode == "0644"
    fail_msg: >-
      The Hermes CABAL WhatsApp stack requires Linux AMD64, the exact source
      revision and loopback bridge, and the approved external CNPG endpoint,
      identity, port, verify-full mode, and CA destination contract.

- name: Check the Hermes owner account
  ansible.builtin.getent:
    database: passwd
    key: "{{ hermes_cabal_whatsapp_owner }}"

- name: Require explicit bridge activation gates
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_pairing_accepted | bool
      - hermes_cabal_whatsapp_readiness_accepted | bool
      - hermes_cabal_whatsapp_database_prepare | bool
      - hermes_cabal_whatsapp_database_accepted | bool
      - hermes_cabal_whatsapp_database_backup_accepted | bool
      - hermes_cabal_whatsapp_database_tls_accepted | bool
      - hermes_cabal_whatsapp_database_pg18_migration_accepted | bool
      - hermes_cabal_whatsapp_source_install | bool
      - hermes_cabal_whatsapp_bridge_build | bool
    fail_msg: >-
      Bridge activation is blocked until external CNPG preparation, database,
      backup, TLS, PostgreSQL 18 migration, manual pairing, CONNECTED readiness,
      and exact source/build gates are all accepted.
  when: hermes_cabal_whatsapp_bridge_enabled | bool

- name: Create the dedicated bridge group
  ansible.builtin.group:
    name: "{{ hermes_cabal_whatsapp_service_group }}"
    system: true
    state: present

- name: Create the dedicated bridge service account
  ansible.builtin.user:
    name: "{{ hermes_cabal_whatsapp_service_user }}"
    group: "{{ hermes_cabal_whatsapp_service_group }}"
    home: "{{ hermes_cabal_whatsapp_data_dir }}"
    shell: "/usr/sbin/nologin"
    system: true
    create_home: false
    state: present

- name: Create private WhatsApp stack directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_cabal_whatsapp_application_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_cabal_whatsapp_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_cabal_whatsapp_root }}/src"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_cabal_whatsapp_bin_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_cabal_whatsapp_root }}/venvs"
      owner: "{{ hermes_cabal_whatsapp_owner }}"
      group: "{{ hermes_cabal_whatsapp_owner }}"
      mode: "0755"
    - path: "{{ hermes_cabal_whatsapp_data_dir }}"
      owner: "{{ hermes_cabal_whatsapp_service_user }}"
      group: "{{ hermes_cabal_whatsapp_service_group }}"
      mode: "0700"
    - path: "{{ hermes_cabal_whatsapp_config_dir }}"
      owner: root
      group: root
      mode: "0755"
