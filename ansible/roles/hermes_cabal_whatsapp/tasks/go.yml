---
- name: Create Go toolchain staging directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "/var/cache/hermes-cabal"
    - "{{ hermes_cabal_whatsapp_application_root }}/toolchains"
    - "{{ hermes_cabal_whatsapp_application_root }}/toolchains/go"
    - "{{ hermes_cabal_whatsapp_go_root }}"
  when: hermes_cabal_whatsapp_go_install | bool

- name: Download the pinned Go toolchain archive
  ansible.builtin.get_url:
    url: "{{ hermes_cabal_whatsapp_go_archive_url }}"
    dest: "/var/cache/hermes-cabal/go{{ hermes_cabal_whatsapp_go_version }}.linux-amd64.tar.gz"
    checksum: "{{ hermes_cabal_whatsapp_go_archive_checksum }}"
    owner: root
    group: root
    mode: "0644"
  register: hermes_cabal_whatsapp_go_download
  when: hermes_cabal_whatsapp_go_install | bool

- name: Install the pinned Go toolchain
  ansible.builtin.unarchive:
    src: "/var/cache/hermes-cabal/go{{ hermes_cabal_whatsapp_go_version }}.linux-amd64.tar.gz"
    dest: "{{ hermes_cabal_whatsapp_go_root }}"
    remote_src: true
    extra_opts:
      - "--strip-components=1"
    creates: "{{ hermes_cabal_whatsapp_go_binary }}"
    owner: root
    group: root
  when: hermes_cabal_whatsapp_go_install | bool

- name: Read the selected Go toolchain version
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_whatsapp_go_binary }}"
      - version
  register: hermes_cabal_whatsapp_go_version_result
  changed_when: false
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Require exact Go 1.25.0 linux amd64
  ansible.builtin.assert:
    that:
      - >-
        'go version go' ~ hermes_cabal_whatsapp_go_version ~ ' linux/amd64'
        in hermes_cabal_whatsapp_go_version_result.stdout
    fail_msg: >-
      The bridge build requires the pinned Go 1.25.0 linux/amd64 toolchain at
      {{ hermes_cabal_whatsapp_go_binary }}.
  when: hermes_cabal_whatsapp_bridge_build | bool
