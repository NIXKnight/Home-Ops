---
# SECURITY (binding, Section 14): the controller supplies only the password and
# approved public CA file. Secret-bearing tasks are no_log, probes use PGPASSWORD
# rather than argv, diagnostics are fixed strings, and this role never reads a
# Kubernetes Secret or runs a schema migration.
- name: Require the approved external CNPG CA inputs
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_ca_source | length > 0
      - >-
        hermes_cabal_whatsapp_database_ca_checksum
        is match('^sha256:[0-9a-f]{64}$')
    fail_msg: >-
      External CNPG preparation requires an approved public CA source and its
      lowercase sha256 checksum; neither may be omitted.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Inspect the approved external CNPG CA source on the controller
  ansible.builtin.stat:
    path: "{{ hermes_cabal_whatsapp_database_ca_source }}"
    checksum_algorithm: sha256
  become: false
  delegate_to: localhost
  register: hermes_cabal_whatsapp_database_ca_source_stat
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require the approved external CNPG CA source and checksum to match
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_ca_source_stat.stat.exists
      - hermes_cabal_whatsapp_database_ca_source_stat.stat.isreg
      - >-
        'sha256:' ~ hermes_cabal_whatsapp_database_ca_source_stat.stat.checksum
        == hermes_cabal_whatsapp_database_ca_checksum
    fail_msg: >-
      The approved external CNPG public CA file is absent or does not match its
      declared sha256 checksum.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Create the external CNPG trust directory
  ansible.builtin.file:
    path: "{{ hermes_cabal_whatsapp_database_ca_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Install the approved external CNPG CA atomically
  ansible.builtin.copy:
    src: "{{ hermes_cabal_whatsapp_database_ca_source }}"
    dest: "{{ hermes_cabal_whatsapp_database_ca_path }}"
    owner: root
    group: root
    mode: "{{ hermes_cabal_whatsapp_database_ca_mode }}"
    unsafe_writes: false
  notify: Restart Hermes CABAL WhatsApp bridge
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Verify the installed external CNPG CA checksum
  ansible.builtin.stat:
    path: "{{ hermes_cabal_whatsapp_database_ca_path }}"
    checksum_algorithm: sha256
  register: hermes_cabal_whatsapp_database_ca_target_stat
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require the installed external CNPG CA checksum to match
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_ca_target_stat.stat.exists
      - hermes_cabal_whatsapp_database_ca_target_stat.stat.isreg
      - >-
        'sha256:' ~ hermes_cabal_whatsapp_database_ca_target_stat.stat.checksum
        == hermes_cabal_whatsapp_database_ca_checksum
    fail_msg: The installed external CNPG public CA checksum does not match.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Remove the obsolete external CNPG marked hosts block
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED HERMES CABAL WHATSAPP CNPG"
    state: absent
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Install external CNPG client preflight tools
  ansible.builtin.package:
    name: "{{ hermes_cabal_whatsapp_database_client_packages }}"
    state: present
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Resolve the bridge database password from Vault or controller environment
  ansible.builtin.set_fact:
    hermes_cabal_whatsapp_database_password: >-
      {{
        vars.get(hermes_cabal_whatsapp_database_password_env, '')
        | default(
            lookup('ansible.builtin.env', hermes_cabal_whatsapp_database_password_env),
            true
          )
      }}
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Validate the external CNPG password without exposing it
  ansible.builtin.set_fact:
    hermes_cabal_whatsapp_database_password_valid: >-
      {{
        hermes_cabal_whatsapp_database_password | default('')
        is match('^[A-Za-z0-9._~-]{32,}$')
      }}
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require the external CNPG credential
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_password_valid | bool
    fail_msg: >-
      WHATSAPP_BRIDGE_DB_PASSWORD is missing or invalid; define it in encrypted
      inventory or supply it through the controller environment as a URL-safe
      value of at least 32 characters.
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Resolve the external CNPG DNS target
  ansible.builtin.command:
    argv:
      - getent
      - ahostsv4
      - "{{ hermes_cabal_whatsapp_database_host }}"
  register: hermes_cabal_whatsapp_database_resolution_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Record external CNPG DNS target status
  ansible.builtin.set_fact:
    hermes_cabal_whatsapp_database_resolution_valid: >-
      {{
        hermes_cabal_whatsapp_database_resolution_probe.rc == 0
        and (
          hermes_cabal_whatsapp_database_resolution_probe.stdout
          | default('')
          | regex_findall('(?m)^\\s*([0-9]{1,3}(?:\\.[0-9]{1,3}){3})\\s+')
          | unique
          | list
        ) == [hermes_cabal_whatsapp_database_address]
      }}
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require the approved external CNPG DNS target
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_resolution_valid | bool
    fail_msg: External CNPG hostname preflight failed the approved DNS target.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Verify external CNPG TCP readiness
  when: hermes_cabal_whatsapp_database_prepare | bool
  block:
    - name: Wait for the external CNPG listener
      ansible.builtin.wait_for:
        host: "{{ hermes_cabal_whatsapp_database_host }}"
        port: "{{ hermes_cabal_whatsapp_database_port }}"
        state: started
        connect_timeout: 5
        timeout: 15
      changed_when: false
      no_log: true
  rescue:
    - name: Report external CNPG TCP readiness failure
      ansible.builtin.fail:
        msg: External CNPG TCP readiness failed on the approved endpoint.

- name: Probe external CNPG TLS hostname verification
  ansible.builtin.command:
    argv:
      - openssl
      - s_client
      - -starttls
      - postgres
      - -connect
      - "{{ hermes_cabal_whatsapp_database_host }}:{{ hermes_cabal_whatsapp_database_port }}"
      - -servername
      - "{{ hermes_cabal_whatsapp_database_host }}"
      - -verify_hostname
      - "{{ hermes_cabal_whatsapp_database_host }}"
      - -verify_return_error
      - -CAfile
      - "{{ hermes_cabal_whatsapp_database_ca_path }}"
      - -brief
    stdin: ""
    stdin_add_newline: false
  register: hermes_cabal_whatsapp_database_tls_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Record external CNPG TLS verification status
  ansible.builtin.set_fact:
    hermes_cabal_whatsapp_database_tls_valid: >-
      {{ hermes_cabal_whatsapp_database_tls_probe.rc == 0 }}
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require external CNPG TLS hostname verification
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_tls_valid | bool
    fail_msg: External CNPG TLS hostname verification failed.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Probe external CNPG PostgreSQL readiness without migrations
  ansible.builtin.command:
    argv:
      - psql
      - --host
      - "{{ hermes_cabal_whatsapp_database_host }}"
      - --port
      - "{{ hermes_cabal_whatsapp_database_port }}"
      - --username
      - "{{ hermes_cabal_whatsapp_database_user }}"
      - --dbname
      - "{{ hermes_cabal_whatsapp_database_name }}"
      - --no-password
      - --no-psqlrc
      - --set
      - ON_ERROR_STOP=1
      - --tuples-only
      - --no-align
      - --command
      - SELECT 1;
  environment:
    PGPASSWORD: "{{ hermes_cabal_whatsapp_database_password }}"
    PGSSLMODE: "{{ hermes_cabal_whatsapp_database_sslmode }}"
    PGSSLROOTCERT: "{{ hermes_cabal_whatsapp_database_ca_path }}"
  register: hermes_cabal_whatsapp_database_readiness_probe
  changed_when: false
  failed_when: false
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Record external CNPG PostgreSQL readiness status
  ansible.builtin.set_fact:
    hermes_cabal_whatsapp_database_readiness_valid: >-
      {{
        hermes_cabal_whatsapp_database_readiness_probe.rc == 0
        and hermes_cabal_whatsapp_database_readiness_probe.stdout | trim == '1'
      }}
  no_log: true
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Require external CNPG PostgreSQL readiness
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_database_readiness_valid | bool
    fail_msg: External CNPG PostgreSQL readiness failed.
  when: hermes_cabal_whatsapp_database_prepare | bool

- name: Render the root-only external CNPG bridge environment
  ansible.builtin.copy:
    content: |
      DATABASE_URL={{
        'postgresql://' ~ hermes_cabal_whatsapp_database_user ~ ':' ~
        hermes_cabal_whatsapp_database_password ~ '@' ~
        hermes_cabal_whatsapp_database_host ~ ':' ~
        hermes_cabal_whatsapp_database_port ~ '/' ~
        hermes_cabal_whatsapp_database_name ~ '?sslmode=' ~
        hermes_cabal_whatsapp_database_sslmode ~ '&sslrootcert=' ~
        hermes_cabal_whatsapp_database_ca_path
      }}
      BRIDGE_ADDR={{ hermes_cabal_whatsapp_bind }}
      BRIDGE_DATA_DIR={{ hermes_cabal_whatsapp_data_dir }}
      BRIDGE_LOG_LEVEL={{ hermes_cabal_whatsapp_log_level }}
      MEDIA_RETRY_ENABLED=false
    dest: "{{ hermes_cabal_whatsapp_env_file }}"
    owner: root
    group: root
    mode: "0600"
    unsafe_writes: false
  notify: Restart Hermes CABAL WhatsApp bridge
  no_log: true
  diff: false
  when: hermes_cabal_whatsapp_database_prepare | bool
