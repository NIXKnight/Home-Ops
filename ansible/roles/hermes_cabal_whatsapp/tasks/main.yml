  ansible.builtin.import_tasks: preflight.yml
  tags:
    - hermes
    - whatsapp-bridge
    - whatsapp-mcp

- name: Prepare exact Go toolchain
  ansible.builtin.import_tasks: go.yml
  tags:
    - hermes
    - whatsapp-bridge

- name: Prepare and preflight the external CNPG connection
  ansible.builtin.import_tasks: database.yml
  tags:
    - hermes
    - whatsapp-bridge

- name: Prepare exact WhatsApp source
  ansible.builtin.import_tasks: source.yml
  tags:
    - hermes
    - whatsapp-bridge
    - whatsapp-mcp

- name: Build and configure the Go bridge
  ansible.builtin.import_tasks: bridge.yml
