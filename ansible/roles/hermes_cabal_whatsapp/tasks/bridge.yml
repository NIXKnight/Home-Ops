---
- name: Create the Go build and module caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ hermes_cabal_whatsapp_go_cache_dir }}"
    - "{{ hermes_cabal_whatsapp_go_module_cache_dir }}"
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Remove the versioned bridge binary for an explicit rebuild
  ansible.builtin.file:
    path: "{{ hermes_cabal_whatsapp_binary }}"
    state: absent
  when:
    - hermes_cabal_whatsapp_bridge_build | bool
    - hermes_cabal_whatsapp_force_rebuild | bool

- name: Build the reproducible static WhatsApp bridge
  ansible.builtin.command:
    argv:
      - "{{ hermes_cabal_whatsapp_go_binary }}"
      - build
      - -mod=readonly
      - -trimpath
      - -buildvcs=false
      - -ldflags=-buildid=
      - -o
      - "{{ hermes_cabal_whatsapp_binary }}"
      - .
    chdir: "{{ hermes_cabal_whatsapp_source_dir }}/bridge"
    creates: "{{ hermes_cabal_whatsapp_binary }}"
  environment:
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOOS: linux
    GOARCH: amd64
    GOAMD64: v1
    GOCACHE: "{{ hermes_cabal_whatsapp_go_cache_dir }}"
    GOMODCACHE: "{{ hermes_cabal_whatsapp_go_module_cache_dir }}"
  notify: Restart Hermes CABAL WhatsApp bridge
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Set immutable bridge binary ownership
  ansible.builtin.file:
    path: "{{ hermes_cabal_whatsapp_binary }}"
    state: file
    owner: root
    group: root
    mode: "0755"
  notify: Restart Hermes CABAL WhatsApp bridge
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Calculate the bridge binary SHA-256
  ansible.builtin.stat:
    path: "{{ hermes_cabal_whatsapp_binary }}"
    checksum_algorithm: sha256
  register: hermes_cabal_whatsapp_binary_stat
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Record the bridge binary SHA-256 on the target
  ansible.builtin.copy:
    content: >-
      {{ hermes_cabal_whatsapp_binary_stat.stat.checksum }}  {{ hermes_cabal_whatsapp_binary | basename }}
    dest: "{{ hermes_cabal_whatsapp_manifest }}"
    owner: root
    group: root
    mode: "0644"
  when: hermes_cabal_whatsapp_bridge_build | bool

- name: Check required bridge activation artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hermes_cabal_whatsapp_binary }}"
    - "{{ hermes_cabal_whatsapp_env_file }}"
    - "{{ hermes_cabal_whatsapp_database_ca_path }}"
  register: hermes_cabal_whatsapp_activation_artifacts
  when: hermes_cabal_whatsapp_bridge_enabled | bool

- name: Require staged bridge artifacts before activation
  ansible.builtin.assert:
    that:
      - hermes_cabal_whatsapp_activation_artifacts.results | map(attribute='stat.exists') | min
    fail_msg: >-
      The exact bridge binary, root-only external CNPG environment, or approved
      public CA file is missing.
  when: hermes_cabal_whatsapp_bridge_enabled | bool

- name: Install the isolated bridge system service
  ansible.builtin.template:
    src: hermes-cabal-whatsapp-bridge.service.j2
    dest: "/etc/systemd/system/{{ hermes_cabal_whatsapp_service_name }}"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for Hermes CABAL WhatsApp
    - Restart Hermes CABAL WhatsApp bridge

- name: Apply bridge unit changes before state convergence
  ansible.builtin.meta: flush_handlers

- name: Converge the gated bridge service state
  ansible.builtin.systemd_service:
    name: "{{ hermes_cabal_whatsapp_service_name }}"
    enabled: "{{ hermes_cabal_whatsapp_bridge_enabled | bool }}"
    state: "{{ (hermes_cabal_whatsapp_bridge_enabled | bool) | ternary('started', 'stopped') }}"
    daemon_reload: true
